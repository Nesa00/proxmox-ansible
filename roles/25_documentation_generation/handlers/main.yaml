- name: Restart documentation service
  ansible.builtin.systemd:
    name: proxmox-docs
    state: restarted
  when: ansible_facts.services['proxmox-docs.service'] is defined

- name: Reload documentation cache
  ansible.builtin.shell: |
    systemctl reload proxmox-docs || true
  changed_when: false

- name: Update documentation index
  ansible.builtin.template:
    src: report_index.md.j2
    dest: "{{ documentation_path }}/README.md"
    mode: '0644'
    owner: root
    group: root
